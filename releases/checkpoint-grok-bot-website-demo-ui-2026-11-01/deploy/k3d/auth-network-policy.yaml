# Keep the public HTTP endpoint on the ingress controller and the model gateway
# on personal Agent namespaces only. Namespace labels are set by bootstrap.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coke-grok-auth-ingress
spec:
  podSelector:
    matchLabels:
      app: coke-grok-auth
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: coke-grok-bot
      ports:
        - protocol: TCP
          port: 3002
