# Insert within the existing codex.cokeagent.com server block.
# The VPS listener is an SSH reverse tunnel to the Mac K3D ingress.
location = /grok-bot { return 301 /grok-bot/; }
location ^~ /grok-bot/ {
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:14329;
}
