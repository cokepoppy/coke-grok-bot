# Apply only after creating the namespace, auth-config ConfigMap and auth-secrets Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coke-grok-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coke-grok-auth
  template:
    metadata:
      labels:
        app: coke-grok-auth
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: private-secrets
          image: coke-grok-auth:diag-20261102-04
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec", "umask 077; cp /source/mysql-password /private/mysql-password; cp /source/google-secret /private/google-secret; cp /runtime/model-key /private/model-key; cp /runtime/desktop-signing-key /private/desktop-signing-key; cp /runtime/gateway-cert.pem /private/gateway-cert.pem; cp /runtime/gateway-key.pem /private/gateway-key.pem; cp /runtime/broker-cert.pem /private/broker-cert.pem; cp /runtime/broker-token /private/broker-token; chmod 600 /private/mysql-password /private/google-secret /private/model-key /private/desktop-signing-key /private/gateway-cert.pem /private/gateway-key.pem /private/broker-cert.pem /private/broker-token; chown 1000:1000 /private/mysql-password /private/google-secret /private/model-key /private/desktop-signing-key /private/gateway-cert.pem /private/gateway-key.pem /private/broker-cert.pem /private/broker-token"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - { name: source-secrets, mountPath: /source, readOnly: true }
            - { name: runtime-source-secrets, mountPath: /runtime, readOnly: true }
            - { name: private-secrets, mountPath: /private }
      containers:
        - name: auth
          image: coke-grok-auth:diag-20261102-04
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 3001 }
            - { name: model, containerPort: 3002 }
          envFrom:
            - configMapRef: { name: auth-config }
            - configMapRef: { name: auth-runtime-config }
          env:
            - { name: COKE_GROK_AUTH_HOST, value: "0.0.0.0" }
            - { name: COKE_GROK_AUTH_PORT, value: "3001" }
            - { name: COKE_GROK_MYSQL_PASSWORD_FILE, value: /run/coke-secrets/mysql-password }
            - { name: COKE_GROK_GOOGLE_SECRET_FILE, value: /run/coke-secrets/google-secret }
            - { name: COKE_GROK_MODEL_KEY_FILE, value: /run/coke-secrets/model-key }
            - { name: COKE_GROK_DESKTOP_SIGNING_KEY_FILE, value: /run/coke-secrets/desktop-signing-key }
            - { name: COKE_GROK_GATEWAY_TLS_CERT_FILE, value: /run/coke-secrets/gateway-cert.pem }
            - { name: COKE_GROK_GATEWAY_TLS_KEY_FILE, value: /run/coke-secrets/gateway-key.pem }
            - { name: COKE_GROK_BROKER_CA_FILE, value: /run/coke-secrets/broker-cert.pem }
            - { name: COKE_GROK_BROKER_TOKEN_FILE, value: /run/coke-secrets/broker-token }
            - { name: COKE_GROK_BROKER_URL, value: https://coke-grok-desktop-broker.coke-grok-bot.svc.cluster.local:3003/ }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const u=new URL(process.env.COKE_GROK_PUBLIC_ORIGIN),p=(u.pathname.endsWith('/')?u.pathname.slice(0,-1):u.pathname)+'/api/auth/ready';require('node:http').get({host:'127.0.0.1',port:3001,path:p,headers:{host:u.host},timeout:3000},r=>process.exit(r.statusCode===204?0:1)).on('timeout',function(){this.destroy()}).on('error',()=>process.exit(1))"
            periodSeconds: 5
            timeoutSeconds: 4
          volumeMounts:
            - { name: private-secrets, mountPath: /run/coke-secrets, readOnly: true }
      volumes:
        - name: source-secrets
          secret:
            secretName: auth-secrets
            defaultMode: 256
        - name: runtime-source-secrets
          secret:
            secretName: auth-runtime-secrets
            defaultMode: 256
        - name: private-secrets
          emptyDir: { medium: Memory }
---
apiVersion: v1
kind: Service
metadata:
  name: coke-grok-auth
spec:
  type: ClusterIP
  selector: { app: coke-grok-auth }
  ports:
    - { name: http, port: 3001, targetPort: http }
